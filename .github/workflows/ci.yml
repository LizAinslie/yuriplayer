name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # compileSdk 37 is currently only published on the Android SDK beta/canary
      # channel, so we install it manually instead of via setup-android's stable
      # `packages` list (which fails with "Failed to find package platforms;android-37").
      - name: Set up Android SDK (stable packages)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            build-tools;36.0.0

      - name: Install compileSdk 37 (beta channel)
        run: |
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android + desktop + unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:compileKotlinJvm \
            :core:jvmTest \
            :components:compileKotlinJvm \
            :desktop:compileKotlin \
            :app:assembleDebug
